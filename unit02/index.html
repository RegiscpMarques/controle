<!doctype html>

<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">

  <title>Slides</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    /*
     * Área de visualização.
     */
    #viewport {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: auto;

      background: #000;

      /*
       * Evita seleção acidental durante o arraste.
       */
      user-select: none;
      -webkit-user-select: none;

      /*
       * Permite o comportamento normal de rolagem
       * quando não estamos arrastando um slide ampliado.
       */
      touch-action: pan-x pan-y;
    }

    /*
     * Área que contém os slides.
     */
    #slides {

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 0;
      margin: 0;
    }

    /*
     * Cada slide ocupa inicialmente toda a largura
     * disponível.
     */
    .slide-wrapper {

      position: relative;

      width: 100%;

      display: flex;
      justify-content: center;

      overflow: hidden;

      background: #000;
    }

    /*
     * Imagem do slide.
     */
    .slide {

      display: block;

      width: 100%;
      height: auto;

      max-width: none;

      /*
       * Impede o navegador de iniciar o arraste
       * padrão da imagem.
       */
      -webkit-user-drag: none;

      user-select: none;
      -webkit-user-select: none;

      cursor: default;

      transform-origin: center center;

      will-change: transform;
    }


    /*
     * ------------------------------------------------------------
     * Quando o slide está ampliado
     * ------------------------------------------------------------
     */

    .slide-wrapper.zoomed {

      /*
       * O wrapper ganha uma área maior para o slide.
       */
      overflow: hidden;

      cursor: grab;

      /*
       * Deixa um pequeno espaço visual ao redor.
       */
      padding: 20px;
    }

    .slide-wrapper.dragging {

      cursor: grabbing;
    }

    .slide-wrapper.zoomed .slide {

      cursor: grab;
    }

    .slide-wrapper.dragging .slide {

      cursor: grabbing;
    }


    /*
     * ------------------------------------------------------------
     * Controles
     * ------------------------------------------------------------
     */

    #controls {

      position: fixed;

      right: 20px;
      bottom: 20px;

      z-index: 1000;

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 8px 10px;

      background: rgba(0, 0, 0, 0.75);

      border-radius: 12px;

      opacity: 0;

      transform: translateY(10px);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;

      pointer-events: none;
    }

    #controls.visible {

      opacity: 1;

      transform: translateY(0);

      pointer-events: auto;
    }


    #controls button {

      width: 42px;
      height: 42px;

      border: 0;

      border-radius: 8px;

      background: rgba(255, 255, 255, 0.15);

      color: #fff;

      font-size: 21px;

      line-height: 1;

      cursor: pointer;
    }

    #controls button:hover {

      background: rgba(255, 255, 255, 0.30);
    }


    #zoomLevel {

      min-width: 55px;

      color: #fff;

      font-family: Arial, sans-serif;

      font-size: 14px;

      text-align: center;
    }


    /*
     * ------------------------------------------------------------
     * Indicador de zoom
     * ------------------------------------------------------------
     */

    #zoomHint {

      position: fixed;

      top: 20px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      padding: 8px 14px;

      color: #fff;

      background: rgba(0, 0, 0, 0.75);

      border-radius: 8px;

      font-family: Arial, sans-serif;

      font-size: 13px;

      opacity: 0;

      pointer-events: none;

      transition: opacity 0.25s ease;
    }

    #zoomHint.visible {

      opacity: 1;
    }


  </style>

</head>

<body>

  <div id="viewport">

```
<div id="slides"></div>
```

  </div>

  <div id="zoomHint">

```
Arraste o slide para navegar · Ctrl + roda para zoom · 0 para restaurar
```

  </div>

  <div id="controls">

```
<button
  id="zoomOut"
  type="button"
  title="Diminuir zoom">
  −
</button>

<span id="zoomLevel">100%</span>

<button
  id="zoomIn"
  type="button"
  title="Aumentar zoom">
  +
</button>

<button
  id="zoomReset"
  type="button"
  title="Restaurar zoom">
  1:1
</button>

<button
  id="fullscreen"
  type="button"
  title="Tela cheia">
  ⛶
</button>
```

  </div>

  <script>

    (() => {

      /*
       * ==========================================================
       * CONFIGURAÇÃO
       * ==========================================================
       */

      const COUNT = 23;

      const MIN_ZOOM = 1;

      const MAX_ZOOM = 4;

      const ZOOM_STEP = 0.25;


      /*
       * ==========================================================
       * ELEMENTOS
       * ==========================================================
       */

      const viewport =
        document.getElementById('viewport');

      const slides =
        document.getElementById('slides');

      const controls =
        document.getElementById('controls');

      const zoomInButton =
        document.getElementById('zoomIn');

      const zoomOutButton =
        document.getElementById('zoomOut');

      const zoomResetButton =
        document.getElementById('zoomReset');

      const fullscreenButton =
        document.getElementById('fullscreen');

      const zoomLevel =
        document.getElementById('zoomLevel');

      const zoomHint =
        document.getElementById('zoomHint');


      /*
       * ==========================================================
       * ESTADO
       * ==========================================================
       */

      let currentSlide = null;

      let zoom = 1;

      let offsetX = 0;

      let offsetY = 0;

      let dragging = false;

      let dragStartX = 0;

      let dragStartY = 0;

      let dragOriginX = 0;

      let dragOriginY = 0;

      let controlsTimer = null;


      /*
       * ==========================================================
       * CRIAÇÃO DOS SLIDES
       * ==========================================================
       */

      function createSlides() {

        for (let i = 1; i <= COUNT; i++) {

          const wrapper =
            document.createElement('div');

          wrapper.className =
            'slide-wrapper';


          const img =
            document.createElement('img');

          img.className =
            'slide';

          img.src =
            encodeURI(`slide (${i}).png`);

          img.alt =
            `Slide ${i}`;

          img.loading =
            i <= 3
              ? 'eager'
              : 'lazy';

          img.draggable =
            false;


          /*
           * Cada slide recebe seus próprios dados
           * de zoom.
           */

          wrapper.dataset.zoom = '1';

          wrapper.appendChild(img);

          slides.appendChild(wrapper);


          /*
           * Clicar em um slide o torna o slide ativo.
           */

          wrapper.addEventListener(
            'pointerdown',
            () => {

              currentSlide =
                wrapper;

              showControls();

            }
          );


          /*
           * Clique duplo:
           *
           * 100% → 200%
           * 200% → 100%
           */

          wrapper.addEventListener(
            'dblclick',
            (event) => {

              event.preventDefault();

              currentSlide =
                wrapper;

              const rect =
                wrapper.getBoundingClientRect();

              const x =
                event.clientX - rect.left;

              const y =
                event.clientY - rect.top;

              if (zoom === 1) {

                setZoom(
                  2,
                  x,
                  y
                );

              } else {

                resetZoom();
              }

            }
          );

        }

      }


      /*
       * ==========================================================
       * ATUALIZA A IMAGEM
       * ==========================================================
       */

      function updateTransform() {

        if (!currentSlide) {
          return;
        }

        const img =
          currentSlide.querySelector('.slide');

        if (!img) {
          return;
        }

        img.style.transform =
          `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${zoom})`;

      }


      /*
       * ==========================================================
       * ZOOM
       * ==========================================================
       */

      function setZoom(
        newZoom,
        centerX,
        centerY
      ) {

        if (!currentSlide) {
          return;
        }

        const oldZoom =
          zoom;

        newZoom =
          Math.max(
            MIN_ZOOM,
            Math.min(
              MAX_ZOOM,
              newZoom
            )
          );


        if (newZoom === oldZoom) {
          return;
        }


        /*
         * Se não houver ponto especificado,
         * usa o centro do slide.
         */

        if (
          centerX === undefined ||
          centerY === undefined
        ) {

          const rect =
            currentSlide.getBoundingClientRect();

          centerX =
            rect.width / 2;

          centerY =
            rect.height / 2;

        }


        /*
         * Mantém o ponto sob o cursor
         * durante o zoom.
         */

        offsetX =
          centerX -
          (centerX - offsetX) *
          (newZoom / oldZoom);


        offsetY =
          centerY -
          (centerY - offsetY) *
          (newZoom / oldZoom);


        zoom =
          newZoom;


        currentSlide.dataset.zoom =
          String(zoom);


        if (zoom > 1) {

          currentSlide.classList.add(
            'zoomed'
          );

          showZoomHint();

        } else {

          resetOffsets();

          currentSlide.classList.remove(
            'zoomed'
          );

        }


        updateTransform();

        updateZoomDisplay();

        showControls();

      }


      function zoomIn() {

        setZoom(
          zoom + ZOOM_STEP
        );

      }


      function zoomOut() {

        setZoom(
          zoom - ZOOM_STEP
        );

      }


      function resetOffsets() {

        offsetX = 0;

        offsetY = 0;

      }


      function resetZoom() {

        if (!currentSlide) {
          return;
        }

        zoom = 1;

        resetOffsets();

        currentSlide.dataset.zoom =
          '1';

        currentSlide.classList.remove(
          'zoomed'
        );

        updateTransform();

        updateZoomDisplay();

        showControls();

      }


      function updateZoomDisplay() {

        zoomLevel.textContent =
          `${Math.round(zoom * 100)}%`;

      }


      /*
       * ==========================================================
       * ARRASTE DO SLIDE AMPLIADO
       * ==========================================================
       */

      viewport.addEventListener(
        'pointerdown',
        (event) => {

          if (
            !currentSlide ||
            zoom <= 1
          ) {
            return;
          }


          /*
           * Só arrasta com o botão principal
           * do mouse.
           */

          if (
            event.pointerType === 'mouse' &&
            event.button !== 0
          ) {
            return;
          }


          dragging = true;

          dragStartX =
            event.clientX;

          dragStartY =
            event.clientY;

          dragOriginX =
            offsetX;

          dragOriginY =
            offsetY;


          currentSlide.classList.add(
            'dragging'
          );


          viewport.setPointerCapture(
            event.pointerId
          );


          event.preventDefault();

        }
      );


      viewport.addEventListener(
        'pointermove',
        (event) => {

          if (!dragging) {
            return;
          }


          offsetX =
            dragOriginX +
            (event.clientX - dragStartX);

          offsetY =
            dragOriginY +
            (event.clientY - dragStartY);


          updateTransform();

          event.preventDefault();

        }
      );


      function finishDrag() {

        if (!dragging) {
          return;
        }

        dragging = false;

        if (currentSlide) {

          currentSlide.classList.remove(
            'dragging'
          );

        }

      }


      viewport.addEventListener(
        'pointerup',
        finishDrag
      );

      viewport.addEventListener(
        'pointercancel',
        finishDrag
      );


      /*
       * ==========================================================
       * CTRL + RODA DO MOUSE
       * ==========================================================
       */

      viewport.addEventListener(
        'wheel',
        (event) => {

          /*
           * A roda normal continua disponível
           * para a navegação vertical dos slides.
           */

          if (!event.ctrlKey) {
            return;
          }


          if (!currentSlide) {
            return;
          }


          event.preventDefault();


          const rect =
            currentSlide.getBoundingClientRect();


          const x =
            event.clientX -
            rect.left;

          const y =
            event.clientY -
            rect.top;


          const factor =
            event.deltaY < 0
              ? 1.1
              : 1 / 1.1;


          setZoom(
            zoom * factor,
            x,
            y
          );

        },
        {
          passive: false
        }
      );


      /*
       * ==========================================================
       * BOTÕES
       * ==========================================================
       */

      zoomInButton.addEventListener(
        'click',
        (event) => {

          event.stopPropagation();

          zoomIn();

        }
      );


      zoomOutButton.addEventListener(
        'click',
        (event) => {

          event.stopPropagation();

          zoomOut();

        }
      );


      zoomResetButton.addEventListener(
        'click',
        (event) => {

          event.stopPropagation();

          resetZoom();

        }
      );


      /*
       * ==========================================================
       * FULLSCREEN
       * ==========================================================
       */

      async function toggleFullscreen() {

        try {

          if (!document.fullscreenElement) {

            if (
              document.documentElement
                .requestFullscreen
            ) {

              await document.documentElement
                .requestFullscreen();

            }

          } else {

            if (document.exitFullscreen) {

              await document.exitFullscreen();

            }

          }

        } catch (error) {

          console.warn(
            'Fullscreen não disponível:',
            error
          );

        }

      }


      fullscreenButton.addEventListener(
        'click',
        (event) => {

          event.stopPropagation();

          toggleFullscreen();

          showControls();

        }
      );


      /*
       * ==========================================================
       * PRIMEIRO CLIQUE → FULLSCREEN
       * ==========================================================
       */

      let firstGesture =
        true;


      viewport.addEventListener(
        'click',
        () => {

          if (firstGesture) {

            firstGesture = false;

            toggleFullscreen();

          }

          showControls();

        }
      );


      /*
       * ==========================================================
       * TECLADO
       * ==========================================================
       */

      document.addEventListener(
        'keydown',
        (event) => {

          /*
           * + ou =
           */

          if (
            event.key === '+' ||
            event.key === '='
          ) {

            event.preventDefault();

            zoomIn();

            return;

          }


          /*
           * -
           */

          if (event.key === '-') {

            event.preventDefault();

            zoomOut();

            return;

          }


          /*
           * 0 → 100%
           */

          if (event.key === '0') {

            event.preventDefault();

            resetZoom();

            return;

          }


          /*
           * F → fullscreen
           */

          if (
            event.key === 'f' ||
            event.key === 'F'
          ) {

            event.preventDefault();

            toggleFullscreen();

            return;

          }

        }
      );


      /*
       * ==========================================================
       * CONTROLES AUTOMÁTICOS
       * ==========================================================
       */

      function showControls() {

        controls.classList.add(
          'visible'
        );


        clearTimeout(
          controlsTimer
        );


        controlsTimer =
          setTimeout(
            () => {

              controls.classList.remove(
                'visible'
              );

            },
            3000
          );

      }


      function showZoomHint() {

        zoomHint.classList.add(
          'visible'
        );


        setTimeout(
          () => {

            zoomHint.classList.remove(
              'visible'
            );

          },
          2500
        );

      }


      /*
       * Mostra os controles quando o mouse
       * está próximo do canto inferior direito.
       */

      document.addEventListener(
        'mousemove',
        (event) => {

          const margin =
            100;


          if (
            window.innerWidth -
              event.clientX <
              margin &&

            window.innerHeight -
              event.clientY <
              margin
          ) {

            showControls();

          }

        }
      );


      /*
       * ==========================================================
       * INICIALIZAÇÃO
       * ==========================================================
       */

      createSlides();

      updateZoomDisplay();


      /*
       * Primeiro slide como slide ativo.
       */

      const firstSlide =
        slides.querySelector(
          '.slide-wrapper'
        );


      if (firstSlide) {

        currentSlide =
          firstSlide;

      }


      /*
       * ==========================================================
       * EVITA O ARRASTE PADRÃO DAS IMAGENS
       * ==========================================================
       */

      document.addEventListener(
        'dragstart',
        (event) => {

          event.preventDefault();

        }
      );


    })();

  </script>

</body>

</html>
