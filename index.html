<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle — Visualizador de PDF</title>
    <style>
      html,body { height:100%; margin:0; }
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; display:flex; flex-direction:column; }
      header { padding:1rem; background:#0b63ce; color:white; }
      .container { flex:1; display:flex; flex-direction:column; }
      .viewer { flex:1; border:0; }
      .fallback { padding:1rem; text-align:center; }
      a.button { display:inline-block; padding:0.5rem 1rem; background:#0b63ce; color:#fff; text-decoration:none; border-radius:4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Visualizador: 1-Fundamentos-e-Aplicacoes.pdf</h1>
      <p>Usando o PDF direto no navegador — sem conversão para imagens.</p>
    </header>

    <main class="container">
      <!-- objeto <object> fornece bom fallback e funciona na maioria dos navegadores com visualizador de PDF embutido -->
      <object class="viewer" data="cap01/1-Fundamentos-e-Aplicacoes.pdf" type="application/pdf" width="100%" height="100%">
        <div class="fallback">
          <p>Seu navegador não suporta visualização embutida de PDF.</p>
          <p><a class="button" href="cap01/1-Fundamentos-e-Aplicacoes.pdf" target="_blank" rel="noopener">Abrir/baixar PDF</a></p>
        </div>
      </object>
    </main>

    <footer style="padding:0.5rem 1rem; text-align:center; font-size:0.9rem;">
      <small>&copy; 2026 RegiscpMarques — Repositório controle</small>
    </footer>
  </body>
</html>
