<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>EngHub</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container py-4">

    <div class="text-center mb-5">

        <h1 class="display-3">🚀</h1>

        <h2 class="fw-bold">

            EngHub

        </h2>

        <p>

            Automação e Controle

        </p>

    </div>

    <div class="row g-4">

        <div class="col-12">

            <button class="btn btn-primary w-100 p-4">

                <i class="bi bi-diagram-3-fill"></i>

                Unidade 1 - Revisão de Laplace

            </button>

        </div>

        <div class="col-12">

            <button class="btn btn-warning w-100 p-4">

                <i class="bi bi-arrow-90deg-right"></i>

                 Unidade 2 - Resposta ao Degrau

            </button>

        </div>

        <div class="col-12">

            <button class="btn btn-danger w-100 p-4">

                <i class="bi bi-gear"></i>

                 Unidade 3 - Estabilidade

            </button>

        </div>

        <div class="col-12">

            <button class="btn btn-info w-100 p-4">

                <i class="bi bi-lightbulb"></i>

                 Unidade 4 - Erro em Regime Permanente

            </button>

        </div>
	
	<div class="col-12">

            <button class="btn btn-info w-100 p-4">

                <i class="bi bi-robot"></i>

                 Unidade 5 - Técnicas de Modelagem

            </button>

        </div>

	<div class="col-12">

            <button class="btn btn-info w-100 p-4">

                <i class="bi bi-cpu-fill"></i>

                 Unidade 6 - Controlador PID

            </button>

        </div>



    </div>

</div>

</body>

</html>
